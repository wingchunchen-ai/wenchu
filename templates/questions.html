<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/static/style.css">
    <title>被质疑区</title>
</head>
<body>
    <h1>被质疑区</h1>
    {% include '_flash.html' %}
    {% if questions %}
    <ul>
    {% for q in questions %}
        <li>
            <a href="/question/{{ q['id'] }}">{{ q['question_text'] }}</a>
            （菜谱：<a href="/recipe/{{ q['recipe_id'] }}">{{ q['recipe_name'] }}</a>，{{ q['nickname'] or '匿名' }}，{{ q['created_at'] }}）
        </li>
    {% endfor %}
    </ul>
    {% else %}
    <p>暂时还没有被质疑的菜谱。</p>
    {% endif %}
{% include '_nav.html' %}
</body>
</html>
