<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/static/style.css">
    <title>上传菜谱</title>
</head>
<body>
  <div class="page">
  <h1>上传菜谱</h1>
  {% include '_flash.html' %}
    <form action="/upload" method="post" enctype="multipart/form-data">
        <p>菜名（必填）：<input type="text" name="name" required value="{{ form.get('name', '') }}"></p>
        <p>简介：<input type="text" name="description" value="{{ form.get('description', '') }}"></p>
        <p>第一步标题：<input type="text" name="step_title" value="{{ form.get('step_title', '') }}"></p>
        <p>做什么（必填）：<input type="text" name="action" required value="{{ form.get('action', '') }}"></p>
        <p>工具：<input type="text" name="tools" value="{{ form.get('tools', '') }}"></p>
        <p>工具怎么用：<input type="text" name="tool_usage" value="{{ form.get('tool_usage', '') }}"></p>
        <p>安全提示：<input type="text" name="safety_tip" value="{{ form.get('safety_tip', '') }}"></p>
        <p>菜品图片：<input type="file" name="image" accept="image/*"></p>
        <p><input type="submit" value="上传"></p>
  </form>
  </div>
{% include '_nav.html' %}
</body>
</html>
