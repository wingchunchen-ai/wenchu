<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/style.css">
  <title>修改菜谱</title>
</head>
<body>
  <div class="page">
    <h1>修改菜谱</h1>
    {% include '_flash.html' %}
    <form action="/edit/{{ recipe['id'] }}" method="post">
      <p>菜名：<input type="text" name="name" value="{{ recipe['name'] }}" required></p>
      <p>简介：<input type="text" name="description" value="{{ recipe['description'] }}"></p>
      <p><input type="submit" value="保存修改"></p>
    </form>
    <hr>
    <form action="/delete/{{ recipe['id'] }}" method="post" onsubmit="return confirm('确定要删除这道菜吗？删了就找不回来了。');">
      <button type="submit">删除这道菜</button>
    </form>
    <p><a href="/recipe/{{ recipe['id'] }}">返回详情页</a></p>
  </div>
{% include '_nav.html' %}
</body>
</html>
