<!DOCTYPE html>
<html lang="zh-CN">
<head>
{% include '_head.html' %}
  <title>修改菜谱 - 稳厨</title>
</head>
<body>
  <div class="page">
    <h1>修改菜谱</h1>
    {% include '_flash.html' %}
    {% with action='/edit/' ~ recipe['id'], submit_text='保存修改' %}
    {% include '_recipe_form.html' %}
    {% endwith %}
    <hr>
    {% if recipe['is_official'] %}
    <p class="hint">这是稳厨自带的菜谱，可以修改，但不能删除。</p>
    {% else %}
    <form action="/delete/{{ recipe['id'] }}" method="post" onsubmit="return confirm('确定要删除这道菜吗？删了就找不回来了。');">
      <button type="submit">删除这道菜</button>
    </form>
    {% endif %}
    <p><a href="/recipe/{{ recipe['id'] }}">返回详情页</a></p>
  </div>
{% include '_nav.html' %}
</body>
</html>
