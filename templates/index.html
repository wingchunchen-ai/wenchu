<!DOCTYPE html>
<html lang="zh-CN">
<head>
{% include '_head.html' %}
<title>稳厨 - 有什么锅，就做什么菜</title>
</head>
<body>
<div class="hero">
  <h1>稳厨</h1>
  <p>欢迎来到稳厨：按你家里的锅具，找到能稳稳做成的菜</p>
  <button class="hero-btn" onclick="showRecommend()">进入稳厨</button>
<div id="recommend-popup" style="display:none;">
  <div class="popup-box">
    <h2>今日推荐</h2>
    <div id="recommend-list"></div>
    <button onclick="closePopup()">进入稳厨</button>
  </div>
</div>
</div>
<script src="/static/vote.js"></script>
<script>
function showRecommend() {
  // 每次都向服务器要最新推荐：改过画像后马上能看到新结果
  fetch('/daily_recommend')
    .then(r => r.json())
    .then(renderRecommend)
    .catch(() => renderRecommend({recipes: [], need_profile: false, error: true}));
  document.getElementById('recommend-popup').style.display = 'flex';
}
// 菜名一律用 textContent 当普通文字放进去，不拼进 HTML，防止菜名里的脚本被执行
function renderRecommend(data) {
  const list = document.getElementById('recommend-list');
  list.textContent = '';
  if (!data.recipes || data.recipes.length === 0) {
    const p = document.createElement('p');
    if (data.need_profile) {
      p.appendChild(document.createTextNode('还没填过家里有的锅具，'));
      const a = document.createElement('a');
      a.href = '/profile';
      a.style.color = '#FF8C00';
      a.textContent = '先去填一下';
      p.appendChild(a);
      p.appendChild(document.createTextNode('，稳厨每天给你推能做的菜。'));
    } else if (data.error) {
      p.textContent = '推荐暂时没取到，先去看看全部菜谱吧。';
    } else {
      p.textContent = '今天没有符合你锅具的菜';
    }
    list.appendChild(p);
    return;
  }
  data.recipes.forEach(r => {
    const p = document.createElement('p');
    const a = document.createElement('a');
    a.href = '/recipe/' + encodeURIComponent(r.id);
    a.textContent = r.name;
    const like = document.createElement('button');
    like.type = 'button';
    like.textContent = '👍';
    like.addEventListener('click', () => vote(r.id, 'like'));
    const dislike = document.createElement('button');
    dislike.type = 'button';
    dislike.textContent = '👎';
    dislike.addEventListener('click', () => vote(r.id, 'dislike'));
    p.append(a, ' ', like, ' ', dislike);
    list.appendChild(p);
  });
}
function closePopup() {
  document.getElementById('recommend-popup').style.display = 'none';
  window.location.href = '/recipes';
}
</script>
</body>
</html>
