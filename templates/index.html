<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="hero">
  <h1>稳厨</h1>
  <p>欢迎来到稳厨</p>
  <button class="hero-btn" onclick="showRecommend()">进入稳厨</button>
<div id="recommend-popup" style="display:none;">
  <div class="popup-box">
    <h2>今日推荐</h2>
    <div id="recommend-list"></div>
    <button onclick="closePopup()">进入稳厨</button>
  </div>
</div>
</div>
<script>
function showRecommend() {
  const today = new Date().toDateString();
  const cachedDate = localStorage.getItem('recommend_date');
  if (cachedDate === today) {
    const data = JSON.parse(localStorage.getItem('recommend_data'));
    renderRecommend(data);
  } else {
    fetch('/daily_recommend')
      .then(r => r.json())
      .then(data => {
        if (data.recipes.length > 0) {
          localStorage.setItem('recommend_date', today);
          localStorage.setItem('recommend_data', JSON.stringify(data));
        }

        renderRecommend(data);
      });
  }
  document.getElementById('recommend-popup').style.display = 'flex';
}
function renderRecommend(data) {
  const list = document.getElementById('recommend-list');
  list.innerHTML = '';
  if (data.recipes.length === 0) {
  if (data.need_profile) {
  list.innerHTML = '<p>还没填过家里有的锅具，<a href="/profile" style="color: #FF8C00;">先去填一下</a>，稳厨每天给你推能做的菜。</p>';
  } else {
    list.innerHTML = '<p>今天没有符合你锅具的菜</p>';
  }
    return;
  }
  data.recipes.forEach(r => {
    const div = document.createElement('div');
    div.innerHTML = '<p><a href="/recipe/' + r.id + '">' + r.name + '</a> <button onclick="vote(' + r.id + ', \'like\')">👍</button> <button onclick="vote(' + r.id + ', \'dislike\')">👎</button></p>';
    list.appendChild(div);
  });
}
function vote(recipeId, v) {
  fetch('/vote', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({recipe_id: recipeId, vote: v})
  });
}
function closePopup() {
  document.getElementById('recommend-popup').style.display = 'none';
  window.location.href = '/recipes';
}
</script>
</body>
</html>
